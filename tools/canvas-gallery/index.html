<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Gallery — kanevskyy.dev</title>
<meta name="description" content="A catalog of smooth HTML canvas tricks that bring websites to life — no frameworks, just raw canvas API.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back" id="backLink" href="/tools/">&larr; back to tools</a>
<header>
  <h1>Canvas Gallery</h1>
  <p>A catalog of smooth HTML canvas tricks that bring websites to life — no frameworks, just raw canvas API.</p>
</header>

<!-- ── Showcase view (shown when ?effect= is set) ── -->
<div class="showcase" id="showcase" style="display:none">
  <a class="back" href="/tools/canvas-gallery/">&larr; back to gallery</a>
  <div class="canvas-wrap">
    <canvas id="showcase-canvas"></canvas>
  </div>
  <div class="content">
    <h2 id="showcase-title"></h2>
    <span class="tag" id="showcase-tag"></span>
    <p class="explanation" id="showcase-explain"></p>
    <pre><code id="showcase-code"></code></pre>
  </div>
</div>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="overlay-header">
    <h2 id="overlay-title"></h2>
    <button class="btn-pause" id="btnPause">pause</button>
    <button class="btn-restart" id="btnRestart">restart</button>
    <button class="btn-close" id="btnClose">&times;</button>
  </div>
  <div class="overlay-body">
    <canvas id="overlay-canvas"></canvas>
    <div class="overlay-code" id="overlay-code">
      <button class="code-toggle" id="ocToggle">Show code</button>
      <pre><code id="ocContent"></code></pre>
    </div>
  </div>
</div>

<script>
var effects=[];
function register(name,desc,tag,initFn,drawFn,destroyFn,howItWorks){
  // If destroyFn is a string, it's actually howItWorks with no destroy function
  if(typeof destroyFn==='string'){howItWorks=destroyFn;destroyFn=undefined}
  var jsn=function(s){return "'"+s.replace(/'/g,"\\'")+"'"};
  var code='register('+jsn(name)+','+jsn(desc)+','+jsn(tag)+',\n  '+initFn.toString()+',\n  '+drawFn.toString()+(destroyFn?',\n  '+destroyFn.toString():'')+(howItWorks?',\n  '+jsn(howItWorks):'')+'\n)';
  effects.push({name:name,desc:desc,tag:tag,init:initFn,draw:drawFn,destroy:destroyFn||function(){},howItWorks:howItWorks||desc,code:code});
}
</script>

<script src="effects/effect-01-stardust.js"></script>
